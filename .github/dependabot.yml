# Keeps dependencies and — importantly — the pinned GitHub Actions current.
# Pinning actions to a commit SHA is only safe if something moves the pin when
# an upstream fixes a vulnerability; that is what the github-actions ecosystem
# entry below is for.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR per ecosystem rather than a dozen — CI runs the same gates
      # either way, and a grouped bump is far quicker to review.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
