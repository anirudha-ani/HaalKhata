# Quality gates. The same commands you run locally, across all three
# workspaces, on every push and pull request.
#
# Supply chain: every third-party action is pinned to a full commit SHA. The
# trailing version comments preserve readability and let Dependabot keep the
# immutable pins current through reviewed pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes.
permissions:
  contents: read
  # gitleaks-action on a pull_request event lists the PR's commits through
  # the API to pick its scan range; without this read scope that call is a
  # 403 and the scanner crashes before scanning anything.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This key is the status-check name branch protection matches on, and it is
  # what shows in the PR checks list. If you rename it AFTER adding it as a
  # required check, the rule waits forever for a check that no longer exists
  # and every PR is blocked — so rename it here and update the ruleset together.
  quality-gates:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: haalkhata
          POSTGRES_PASSWORD: release-tests-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haalkhata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MERGE_TEST_ADMIN_URL: postgres://haalkhata:release-tests-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking compares against main, which needs real history.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Runs before anything is built: a leaked credential in the tree or
      # in history on the way to a protected branch fails the gate here.
      # fetch-depth: 0 above is what lets it see history, not only HEAD.
      - name: 'Secrets: nothing committed that looks like a credential'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies — exactly as locked
        run: pnpm install --frozen-lockfile

      - name: 'Deploy: secret provisioning and encryption-key preservation'
        run: pnpm test:deploy

      - name: 'Development: shared environment and Expo secret isolation'
        run: pnpm test:environment

      - name: 'Dependencies: verify exact security patches and audit production'
        run: pnpm audit:production

      # packages/protogen/src is gitignored; every run regenerates it.
      - name: Generate TypeScript from the .proto contract
        run: pnpm gen

      - name: 'Contract: proto style rules (buf lint)'
        run: pnpm proto:lint

      # Breaking-change detection is a PR-time question: does THIS change break
      # the contract as it stands on the base branch? On a push to main there is
      # nothing meaningful to compare — main against itself.
      #
      # `ref=origin/<base>`, not `branch=<base>`: actions/checkout leaves a
      # detached HEAD with only remote-tracking refs, so no local branch exists
      # for buf to resolve and it fails with "couldn't find remote ref main".
      # It passes locally only because a developer's clone has a real `main`.
      - name: 'Contract: no breaking API change vs base branch'
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: pnpm exec buf breaking --against ".git#ref=origin/${PULL_REQUEST_BASE_REF}"

      # Split one concern per step, so a red mark in the summary says WHICH
      # gate failed without expanding anything. Chained with && they all shared
      # one opaque name.
      - name: 'Web: TypeScript compiles (tsc --noEmit)'
        run: pnpm typecheck

      - name: 'Web: lint rules (eslint)'
        run: pnpm lint

      - name: 'Web: unit and real Postgres integration tests'
        env:
          MODERATION_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm test

      - name: 'Shared package: TypeScript compiles'
        run: pnpm typecheck:shared

      - name: 'Shared package: lint rules'
        run: pnpm lint:shared

      - name: 'Shared package: unit tests'
        run: pnpm test:shared

      # The server ships the login callback, public policy and release preflight.
      - name: 'Web: production artifact compiles'
        run: pnpm --filter @haalkhata/web build

      # Native source, build configuration and contract stay gated together.
      - name: 'Mobile app: TypeScript compiles'
        run: pnpm typecheck:mobile

      - name: 'Mobile app: lint rules'
        run: pnpm lint:mobile

      - name: 'Mobile app: unit tests'
        run: pnpm test:mobile

      - name: 'Feature parity: browser and native API entry points'
        run: pnpm test:parity

      - name: 'Mobile app: release input validation'
        run: pnpm --filter @haalkhata/mobile test:release-config

      - name: 'Mobile app: native dependency compatibility'
        # Validate against the locked Expo SDK's bundled native-module matrix.
        # The live endpoint can require patches before their dependencies publish.
        # Explicit `install --check` still validates (unlike offline `expo start`).
        env:
          EXPO_OFFLINE: '1'
        run: pnpm --filter @haalkhata/mobile exec expo install --check
