version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # We return resource messages directly (AIP-133 style) and use
    # google.protobuf.Empty where there is no meaningful payload.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
