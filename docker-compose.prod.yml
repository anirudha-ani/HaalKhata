# Production stack: `docker compose -f docker-compose.prod.yml up -d --wait`.
#
# Standalone rather than an override of docker-compose.yml. Compose merges list
# keys by APPENDING, so an override cannot remove the dev file's published
# ports — and silently publishing Postgres on a public interface is exactly the
# mistake worth designing out. Here only Caddy publishes anything.
#
# Non-secret settings come from /srv/haalkhata/.env (compose reads a file named
# .env from the directory holding this file — which is why deploy.sh cds there
# first). Secrets are files under /srv/haalkhata/secrets/, never values here.
name: haalkhata

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: haalkhata
      POSTGRES_USER: haalkhata
      # Read only at initdb. Rotating this later needs ALTER USER first — see
      # ops/README.md; editing the file alone locks the app out of its own db.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # Sized for a 1 GB droplet. Postgres defaults to max_connections=100, and
    # each idle backend costs a few MB — on a box where the whole budget is
    # ~300 MB of fixed overhead, 100 possible backends is a latent OOM. The
    # app's pool caps at 20 (db.ts), so 30 leaves room for psql and pg_dump.
    command: >-
      postgres
      -c max_connections=30
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    secrets:
      - postgres_password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haalkhata -d haalkhata"]
      interval: 10s
      timeout: 3s
      retries: 10
    # The official entrypoint starts as root only to repair volume ownership
    # and drop to postgres. Keep exactly those capabilities; the database
    # process inherits none after gosu changes uid.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - "no-new-privileges:true"
    # No `ports`. The database is reachable only over the compose network.

  web:
    # deploy.sh writes an exact 40-character commit tag; never fall back to the
    # mutable `latest` tag in production.
    image: ghcr.io/anirudha-ani/haalkhata:${IMAGE_TAG:?set IMAGE_TAG to a deployed commit SHA}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Safe only because this stack's Caddyfile overwrites X-Forwarded-For.
      TRUST_PROXY_HEADERS: "true"
      # Required form: production signs in with Google only, so a stack
      # without this would start, pass readiness, and lock everyone out.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required — production signs in with Google only}
      GOOGLE_MOBILE_CLIENT_IDS: ${GOOGLE_MOBILE_CLIENT_IDS:-}
      # Secrets are read from these files by the app itself (the Docker
      # `_FILE` convention); nothing exports them into the environment.
      SESSION_SECRET_FILE: /run/secrets/session_secret
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: db
      COMPATIBLE_AI_API_KEY_FILE: /run/secrets/openrouter_api_key
      TWILIO_API_KEY_SECRET_FILE: /run/secrets/twilio_api_key_secret
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      # `mock` is deliberately dropped here. In development it keeps the scan
      # flow demoable with no key; in production a fallback that invents
      # plausible line items on someone's real receipt is worse than a visible
      # failure. See plan.txt §6e.
      RECEIPT_AI_PROVIDERS: compatible
      COMPATIBLE_AI_BASE_URL: https://openrouter.ai/api/v1
      COMPATIBLE_AI_MODEL: google/gemini-3-flash-preview
      COMPATIBLE_AI_ZDR: "true"
    secrets:
      - session_secret
      - postgres_password
      - openrouter_api_key
      - twilio_api_key_secret
    # Verified: the app serves fine on a read-only rootfs. It imports
    # next/image nowhere, so nothing writes to .next/cache/images. If that ever
    # changes, add - /app/apps/web/.next/cache to tmpfs.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # busybox wget is present in node:24-alpine. Readiness verifies the
      # signing secret, applies migrations, and performs a live DB round-trip.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # No `ports`. Only Caddy reaches it, over the compose network.

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      # Caddy uses this for certificate expiry and account problem notices.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /srv/haalkhata/.env}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"      # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data     # certificates live here — do not lose this volume
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - "no-new-privileges:true"

secrets:
  session_secret:
    file: /srv/haalkhata/secrets/session_secret
  postgres_password:
    file: /srv/haalkhata/secrets/postgres_password
  openrouter_api_key:
    file: /srv/haalkhata/secrets/openrouter_api_key
  twilio_api_key_secret:
    file: /srv/haalkhata/secrets/twilio_api_key_secret

volumes:
  db-data:
  caddy-data:
  caddy-config:
