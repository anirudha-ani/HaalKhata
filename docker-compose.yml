# Self-hosted deployment: `docker compose up -d --build`.
# Local dev only needs the database: `docker compose up -d db` + `pnpm dev`.
# Secrets come from a `.env` file next to this one (see .env.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: haalkhata
      POSTGRES_USER: haalkhata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haalkhata}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # loopback only; lets `pnpm dev` on the host reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haalkhata -d haalkhata"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        # Baked into the client bundle at build time (see Dockerfile). Compose
        # reads it from the root .env like every other value here; passing it
        # through `environment:` instead would be too late to reach the bundle.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # App config comes from the single .env at the repo root — the same file
    # `pnpm dev` reads. In production prefer Docker secrets for the secret
    # values (SESSION_SECRET, POSTGRES_PASSWORD, COMPATIBLE_AI_API_KEY) and
    # keep only non-secret settings here.
    env_file: .env
    environment:
      # Overrides the DATABASE_URL in .env, which points at localhost for the
      # host dev server. Inside the compose network the database is `db`.
      # `environment:` beats `env_file:`, so this is the effective value.
      DATABASE_URL: postgres://haalkhata:${POSTGRES_PASSWORD:-haalkhata}@db:5432/haalkhata
    ports:
      # Loopback only by default — put a TLS-terminating reverse proxy
      # (Caddy/nginx/Traefik) in front and expose 443 there, not 3000 here.
      # To serve directly on the LAN, change the bind to "3000:3000" but
      # remember session cookies need TLS (the Secure flag is set in prod).
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
