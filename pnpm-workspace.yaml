packages:
  - "apps/*"
  - "packages/*"

# The registry mirror used in dev lags npm by a few days; browserslist asks
# for a caniuse-lite build the mirror doesn't have yet. Pure data package —
# pinning one release back is harmless.
overrides:
  caniuse-lite: 1.0.30001800
  # Security patches not yet selected by the current Next/Expo dependency
  # ranges. Keep the selectors exact so future upstream upgrades take over.
  "postcss@8.4.31": 8.5.23
  "postcss@8.5.16": 8.5.23
  "brace-expansion@>=1.0.0 <1.1.21": 1.1.21
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  # Router query decoding retains its CommonJS API in the patched release.
  "decode-uri-component@<0.5.0": 0.5.0
  "nanoid@3.3.15": 3.3.18
  # xcode uses only the compatible CommonJS `uuid.v4()` API; v11.1.1 is the
  # final CommonJS line and fixes the buffer-bounds advisory in older releases.
  "uuid@7.0.3": 11.1.1
  # Metro 0.84.5 removes its vulnerable image-size dependency. Keep the
  # internally version-locked Metro suite on the same patch release.
  "metro@0.84.4": 0.84.5
  "metro-babel-transformer@0.84.4": 0.84.5
  "metro-cache@0.84.4": 0.84.5
  "metro-cache-key@0.84.4": 0.84.5
  "metro-config@0.84.4": 0.84.5
  "metro-core@0.84.4": 0.84.5
  "metro-file-map@0.84.4": 0.84.5
  "metro-minify-terser@0.84.4": 0.84.5
  "metro-resolver@0.84.4": 0.84.5
  "metro-runtime@0.84.4": 0.84.5
  "metro-source-map@0.84.4": 0.84.5
  "metro-symbolicate@0.84.4": 0.84.5
  "metro-transform-plugins@0.84.4": 0.84.5
  "metro-transform-worker@0.84.4": 0.84.5
  # @xmldom/xmldom fragment-injection advisory (GHSA-6gmq-8vp8-gcm6). Two
  # lines are in the tree: plist pulls 0.8.x, @expo/plist pulls 0.9.x. Each
  # moves to the patch release on its own line.
  "@xmldom/xmldom@0.8.13": 0.8.15
  "@xmldom/xmldom@0.9.10": 0.9.12
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  compression@<1.8.2: ^1.8.2
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2

# Advisories with no patched release to move to, reviewed and found
# unreachable here. Remove an entry once its fix ships and take the upgrade
# instead — a patched release does not make the audit fail again, so nothing
# else will prompt it.
auditConfig:
  ignoreGhsas:
    # node-forge RSA signature verification (<=1.4.0, the latest). Reached
    # only through @expo/cli's expo-updates code signing, which this app does
    # not configure; node-forge is in neither the web tree nor the app bundle.
    - GHSA-86w9-cpqp-85rv
    # braces stack exhaustion on nested patterns (<=3.0.3, the latest). Sits
    # under micromatch in Metro's file map and Next's eslint plugin, where the
    # patterns are this repo's own config, never request input.
    - GHSA-vfj7-8cjw-p6xm

# Native/postinstall packages allowed to run build scripts
allowBuilds:
  "@bufbuild/buf": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@tailwindcss/oxide": true

minimumReleaseAgeExclude:
  - js-yaml@4.3.2
  - lucide-react-native@1.52.0
  - lucide-react@1.52.0
  - oxlint-plugin-react-doctor@0.9.17
  - react-doctor@0.9.17
