syntax = "proto3";

package auth.v1;

import "google/protobuf/empty.proto";
import "common/v1/common.proto";

// Authentication. LogInWithGoogle is the only way in for new clients; every
// auth RPC returns a bearer token for mobile clients and additionally sets an
// httpOnly session cookie for browsers.
//
// SignUp/LogIn are the retired email-or-phone + password flows, kept so an
// already-shipped mobile build keeps working. No current client calls them.
service AuthService {
  rpc SignUp(SignUpRequest) returns (AuthResponse);
  rpc LogIn(LogInRequest) returns (AuthResponse);
  rpc LogInWithGoogle(LogInWithGoogleRequest) returns (AuthResponse);
  rpc LogOut(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc GetMe(google.protobuf.Empty) returns (common.v1.User);
  rpc UpdateProfile(UpdateProfileRequest) returns (common.v1.User);
}

message SignUpRequest {
  // Exactly one of email / phone must be set.
  string email = 1;
  string phone = 2; // E.164, e.g. "+14155552671"
  string name = 3;
  string password = 4;
}

message LogInRequest {
  // Exactly one of email / phone must be set. The server looks the account up
  // by whichever field is non-empty.
  string email = 1;
  string phone = 2;
  string password = 3;
}

message LogInWithGoogleRequest {
  // The credential handed to the client by Google Identity Services. The
  // server verifies it against Google's public keys and reads the account
  // from the verified claims — the client is never trusted to report who it
  // is, so there is no email or name field here on purpose.
  string id_token = 1;
}

message AuthResponse {
  common.v1.User user = 1;
  // Bearer token; pass as "Authorization: Bearer <token>" on future calls.
  string token = 2;
}

message UpdateProfileRequest {
  string name = 1;
  string default_currency = 2;
  // Replaces the caller's whole set of payment handles. An entry with an
  // empty handle removes that method.
  repeated common.v1.PaymentHandle payment_handles = 3;
}
