syntax = "proto3";

package common.v1;

// A person who has signed up, or a "Deleted member" that stands in for one
// in shared history (deleted = true). Nobody exists here before signing up.
message User {
  string id = 1;
  // Private contact field populated only when the caller reads their own
  // profile; empty in group, expense, friend, activity and ledger responses.
  string email = 2;
  string name = 3;
  // Deterministic accent color used for the avatar, e.g. "#0f8a5f".
  string avatar_color = 4;
  // ISO 4217 code, e.g. "USD", "BDT".
  string default_currency = 5;
  // True for every account; false only on a Deleted member.
  bool registered = 6;
  // Private phone number in E.164 format (e.g. "+14155552671"); populated only
  // for the caller's own profile and empty in every public user projection.
  // An account may have an email, a phone, or both. Sign-in is Google only,
  // so a phone identifies and reaches someone rather than authenticating them.
  string phone = 7;
  // Retired, always empty. Where a person wants to be paid is now a list of
  // payment methods they define (payment.v1.PaymentMethod), and it no longer
  // travels on every user: it is sent on the friend ledger, and only to
  // someone who owes them (FriendLedgerResponse.payee_methods).
  repeated PaymentHandle payment_handles = 8 [deprecated = true];
  // Whether this person has been through the first-run flow. Only ever true
  // about the caller themselves; it is meaningless on anyone else and the UI
  // must not read it off another user.
  bool onboarded = 9;
  // Profile picture URL from the person's Google account; empty when they have
  // none. Clients must keep the initials-on-avatar_color rendering as the
  // fallback: it is empty for everyone who signed in without Google, and
  // Google documents the claim as never guaranteed even for those who did.
  string avatar_url = 10;
  // Whether `phone` has passed SMS possession verification. Private like
  // phone itself: meaningful only on the caller's own profile, always false
  // in public projections. False with a phone set marks a number written
  // before verification existed — the clients prompt to verify it, and until
  // then anyone proving possession can claim it away (§34).
  bool phone_verified = 11;
  // Anonymous historical ledger participant; cannot be invited or added to new expenses.
  bool deleted = 12;
  // Whether people who hold this person's verified phone or email can find
  // them from their contacts. Private like phone_verified: set only on the
  // caller's own profile and UNSPECIFIED in every public projection.
  ContactDiscovery contact_discovery = 13;
}

// The person's answer to "let people find me from their contacts".
// Findable is the default: only OFF hides an account.
enum ContactDiscovery {
  // Never answered. Findable, like ON; clients say so once and offer OFF.
  CONTACT_DISCOVERY_UNSPECIFIED = 0;
  CONTACT_DISCOVERY_ON = 1;
  CONTACT_DISCOVERY_OFF = 2;
}

// Retired with User.payment_handles; kept so the field stays declared.
// One "pay me here" identifier: a Venmo username, a Zelle email or phone, a
// $cashtag, a PayPal.Me name.
message PaymentHandle {
  // Matches a settlement method key, e.g. "venmo" | "zelle" | "cashapp" | "paypal".
  string method = 1;
  // Stored exactly as typed — these are opaque identifiers, not addresses to
  // normalize.
  string handle = 2;
}

// A pairwise debt: `from_user_id` owes `to_user_id`.
message Debt {
  string from_user_id = 1;
  string to_user_id = 2;
  int32 amount_cents = 3;
}

// A user's net position: positive = they are owed, negative = they owe.
message NetBalance {
  string user_id = 1;
  int32 net_cents = 2;
}

// One amount in one currency. Balances are kept per currency and never added
// across currencies — a dollar and a euro are not the same cent, and nothing
// here converts.
message CurrencyAmount {
  string currency = 1;
  int32 cents = 2;
}

// Overall position against one person across groups and one-off expenses.
message CounterpartyBalance {
  User user = 1;
  // The position in the caller's default currency only, kept for older
  // clients: > 0 means they owe you. `balances` is the whole picture.
  int32 net_cents = 2;
  // The position in every currency the pair has dealings in, non-zero
  // buckets only: cents > 0 means they owe you that much of that currency.
  repeated CurrencyAmount balances = 3;
}
