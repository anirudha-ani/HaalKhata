syntax = "proto3";

package common.v1;

// A person. Users may be "shadow" users (invited, not yet registered) — they
// participate in expenses like anyone else and claim the account by signing
// up with the same email or phone.
message User {
  string id = 1;
  string email = 2;
  string name = 3;
  // Deterministic accent color used for the avatar, e.g. "#0f8a5f".
  string avatar_color = 4;
  // ISO 4217 code, e.g. "USD", "BDT".
  string default_currency = 5;
  bool registered = 6;
  // Phone number in E.164 format (e.g. "+14155552671"); empty when unset.
  // An account may have an email, a phone, or both; either can be used to log in.
  string phone = 7;
  // Where this person wants to be paid. Visible to anyone who shares an
  // expense with them, which is exactly who needs it — settling is done in
  // Venmo/Zelle/Cash App and this app only records that it happened.
  repeated PaymentHandle payment_handles = 8;
}

// One "pay me here" identifier: a Venmo username, a Zelle email or phone, a
// $cashtag, a PayPal.Me name.
message PaymentHandle {
  // Matches a settlement method key, e.g. "venmo" | "zelle" | "cashapp" | "paypal".
  string method = 1;
  // Stored exactly as typed — these are opaque identifiers, not addresses to
  // normalize.
  string handle = 2;
}

// A pairwise debt: `from_user_id` owes `to_user_id`.
message Debt {
  string from_user_id = 1;
  string to_user_id = 2;
  int32 amount_cents = 3;
}

// A user's net position: positive = they are owed, negative = they owe.
message NetBalance {
  string user_id = 1;
  int32 net_cents = 2;
}

// Overall position against one person across groups and one-off expenses.
// net_cents > 0 means they owe you.
message CounterpartyBalance {
  User user = 1;
  int32 net_cents = 2;
}
