syntax = "proto3";

package common.v1;

// A person. Users may be "shadow" users (invited by email, not yet
// registered) — they participate in expenses like anyone else and claim
// the account by signing up with the same email.
message User {
  string id = 1;
  string email = 2;
  string name = 3;
  // Deterministic accent color used for the avatar, e.g. "#0f8a5f".
  string avatar_color = 4;
  // ISO 4217 code, e.g. "USD", "BDT".
  string default_currency = 5;
  bool registered = 6;
}

// A pairwise debt: `from_user_id` owes `to_user_id`.
message Debt {
  string from_user_id = 1;
  string to_user_id = 2;
  int32 amount_cents = 3;
}

// A user's net position: positive = they are owed, negative = they owe.
message NetBalance {
  string user_id = 1;
  int32 net_cents = 2;
}

// Overall position against one person across groups and one-off expenses.
// net_cents > 0 means they owe you.
message CounterpartyBalance {
  User user = 1;
  int32 net_cents = 2;
}
