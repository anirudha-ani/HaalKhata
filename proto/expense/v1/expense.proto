syntax = "proto3";

package expense.v1;

import "google/protobuf/empty.proto";
import "common/v1/common.proto";
import "group/v1/group.proto";
import "payment/v1/payment.proto";

// Expenses, settlements and balances. All money is integer cents in the
// expense's currency; splits always reconcile to the exact total.
service ExpenseService {
  rpc CreateExpense(CreateExpenseRequest) returns (Expense);
  // Anyone on the expense — creator, payer or ower — may correct it; the
  // "updated" activity tells the rest. Allowed after a settlement in the
  // scope (the balance rebalances against what was paid). An expense cannot
  // be moved between scopes.
  rpc UpdateExpense(UpdateExpenseRequest) returns (Expense);
  rpc ListExpenses(ListExpensesRequest) returns (ListExpensesResponse);
  rpc GetExpense(GetExpenseRequest) returns (GetExpenseResponse);
  // The one number an open edit form asks for on a timer: whether anyone has
  // saved a change since it last looked. Open to whoever may read the expense.
  rpc GetExpenseVersion(GetExpenseVersionRequest) returns (GetExpenseVersionResponse);
  // Creator only. A soft delete: the expense stops counting toward every
  // balance but stays visible everywhere the ledger is shown, marked deleted
  // (Expense.deleted_at), and payments already recorded against it stay on
  // the ledger — so deleting a paid-for expense leaves the payer owed a
  // refund, with the struck-through row explaining why.
  rpc DeleteExpense(DeleteExpenseRequest) returns (google.protobuf.Empty);
  // Opens an itemized expense for everyone at the table for 30 minutes: a link
  // anyone can join through, lines they claim for themselves, one summary at
  // the end. Returns the one already running if there is one. Refuses an
  // expense several people paid: lines nobody claims stay with whoever paid,
  // and a total that moves has to stay theirs alone.
  rpc StartLiveSplit(StartLiveSplitRequest) returns (LiveSplit);
  // Ends a live split early. Only whoever started it may; otherwise it ends by
  // itself. Lines nobody claimed stay with whoever paid, and everyone on the
  // expense then hears what they owe.
  rpc FinishLiveSplit(FinishLiveSplitRequest) returns (google.protobuf.Empty);
  rpc AddComment(AddCommentRequest) returns (Comment);
  // An expense's comments, a page at a time, going back in time from
  // GetExpenseResponse.comments_next_cursor. Open to whoever may read the
  // expense.
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);

  rpc RecordSettlement(RecordSettlementRequest) returns (Settlement);
  // Removes a mistaken payment. Either of the two people on it may; it is a
  // soft delete, so the line stays in the friend ledger struck through with
  // a zero change (FriendLedgerEntry.deleted) and the debt it had paid down
  // comes back.
  rpc DeleteSettlement(DeleteSettlementRequest) returns (google.protobuf.Empty);
  rpc GetGroupBalances(GetGroupBalancesRequest) returns (BalancesResponse);
  rpc GetOverallBalances(google.protobuf.Empty) returns (OverallBalancesResponse);
  rpc GetFriendLedger(GetFriendLedgerRequest) returns (FriendLedgerResponse);
  // The older lines of a friend statement, a page at a time, from
  // FriendLedgerResponse.next_cursor. Each line's running balance continues
  // from the page before it.
  rpc ListFriendLedgerEntries(ListFriendLedgerEntriesRequest) returns (ListFriendLedgerEntriesResponse);
}

message Payer {
  string user_id = 1;
  int64 amount_cents = 2;
}

message Split {
  string user_id = 1;
  int64 owed_cents = 2;
}

// Per-participant input for the chosen split type. Only the field matching
// the split type is read: exact -> amount_cents, percent -> percent_bp
// (basis points, must sum to 10000), shares -> shares. equal ignores all.
message SplitSpec {
  string user_id = 1;
  int64 amount_cents = 2;
  int32 percent_bp = 3;
  int32 shares = 4;
}

message ItemAssignment {
  string user_id = 1;
  int32 weight = 2;
}

message ExpenseItem {
  string id = 1;
  string name = 2;
  int32 quantity = 3;
  int64 total_cents = 4;
  repeated ItemAssignment assignments = 5;
}

message Expense {
  string id = 1;
  string group_id = 2; // empty = one-off (non-group) expense
  string description = 3;
  int64 amount_cents = 4;
  string currency = 5;
  string category = 6;
  string expense_date = 7; // YYYY-MM-DD
  string split_type = 8;   // equal | exact | percent | shares | itemized
  string notes = 9;
  string created_by = 10;
  string created_at = 11;
  repeated Payer payers = 12;
  repeated Split splits = 13;
  repeated ExpenseItem items = 14;
  int64 tax_cents = 15;
  int64 tip_cents = 16;
  // When the expense was deleted; empty while it is live. A deleted expense
  // is still returned by list and detail reads so history stays legible —
  // and stays open to comments, since "why was this removed?" is the
  // conversation the kept row exists to host — but contributes nothing to
  // any balance, cannot be edited, and is never reported as settled.
  string deleted_at = 17;
  // Goes up with every saved change. An open form compares it with
  // GetExpenseVersion to learn that somebody else saved something.
  int32 version = 18;
  // Who saved the latest change; empty until the first edit.
  string updated_by = 19;
}

message CreateExpenseRequest {
  string group_id = 1; // empty = one-off
  string description = 2;
  int64 amount_cents = 3;
  string currency = 4;
  string category = 5;
  string expense_date = 6;
  string split_type = 7;
  string notes = 8;
  repeated Payer payers = 9;       // must sum to amount_cents
  repeated SplitSpec split_specs = 10;
  repeated ExpenseItem items = 11; // itemized only; ids may be empty
  int64 tax_cents = 12;            // itemized only
  int64 tip_cents = 13;            // itemized only
  // Required. A client-generated id (a UUID) naming this one attempt, sent
  // unchanged on every retry of it and replaced only after a success. The
  // server stores at most one expense per (caller, operation_id): a retry
  // of a lost response gets the expense the first attempt created, the
  // same id with a different payload is refused, and a claim is kept for
  // 24 hours. Inside UpdateExpenseRequest it names one attempt at saving an
  // edit, so a retry neither saves nor announces it twice; app versions from
  // before edits carried one leave it empty.
  string operation_id = 14;
  // Opens a live split with the new expense, so it can start with lines
  // nobody has claimed. Ignored inside UpdateExpenseRequest.
  bool start_live_split = 15;
}

// An expense open to everyone at the table for a short while.
message LiveSplit {
  // The join link's token, to share.
  string token = 1;
  // Who started it.
  string host_id = 2;
  // When it ends by itself (ISO 8601).
  string ends_at = 3;
  // Everyone who has joined, whoever started it included.
  repeated string people_ids = 4;
}

message StartLiveSplitRequest {
  string expense_id = 1;
}

message FinishLiveSplitRequest {
  string expense_id = 1;
}

message UpdateExpenseRequest {
  string expense_id = 1;
  CreateExpenseRequest expense = 2;
  // Keep a historical percent/shares mode when submitting its unchanged saved
  // allocations as exact. The server rechecks under the ledger lock.
  bool preserve_split_type = 3;
  // The expense as this form opened it, exactly as the server sent it (or as
  // the form last caught up with it). The server compares it with `expense`
  // to see what this person changed and applies only that to the expense as
  // it stands now, so two people can edit at once. Answers Code.Aborted,
  // saving nothing, when both changed the same thing to different values;
  // the client then reads the latest expense and shows the choice. App
  // versions from before merging leave it unset and replace the whole expense.
  Expense base = 4;
}

// Which part of the caller's own list a ListExpenses request reads, when it
// names no group and no person. Applied by the server, so a narrowed list
// pages through every expense that matches rather than hiding the loaded
// rows that do not.
enum ExpenseListPart {
  // Every expense the caller pays for or owes on.
  EXPENSE_LIST_PART_UNSPECIFIED = 0;
  // Only those outside any group.
  EXPENSE_LIST_PART_ONE_OFF = 1;
  // Only those in `part_group_id`.
  EXPENSE_LIST_PART_GROUP = 2;
}

message ListExpensesRequest {
  // Exactly one of these; both empty = all expenses involving the caller.
  string group_id = 1;
  string with_user_id = 2; // one-off expenses with this user
  // Opaque cursor from the previous response's next_cursor; empty starts at
  // the newest expense. Keyset rather than offset, so expenses added while
  // you page cannot shift the window and duplicate or skip one.
  string cursor = 3;
  // Page size; the server clamps it to a sane maximum. 0 returns one page of
  // up to 500 with `truncated`, the shape app versions before paging read.
  int32 limit = 4;
  // With group_id and with_user_id empty: which part of the caller's own
  // list to read. Refused alongside either of them.
  ExpenseListPart part = 5;
  // The group, with part = EXPENSE_LIST_PART_GROUP.
  string part_group_id = 6;
}

message ListExpensesResponse {
  // Newest first, capped for display; balances are never derived from this
  // list, so a cut list changes what is shown and nothing that is owed.
  repeated Expense expenses = 1;
  repeated common.v1.User users = 2; // everyone referenced by the expenses
  // Ids of listed expenses with nothing pending for the CALLER: their balance
  // in the expense's scope — the group, or the pair ledger with each other
  // participant for a one-off — is zero. Viewer-relative, which is why it is
  // a side list here and not a field on Expense. Scope-level on purpose:
  // settlements pay down a scope's balance, not a specific expense, so while
  // a scope still owes, singling out one of its expenses as "settled" would
  // be an attribution the ledger never made.
  repeated string settled_expense_ids = 3;
  // Set only for a request with limit 0: true when older rows were left
  // off. Paging clients read next_cursor instead.
  bool truncated = 4 [deprecated = true];
  // Pass back as `cursor` for the next, older page; empty at the oldest.
  string next_cursor = 5;
}

message GetExpenseVersionRequest {
  string expense_id = 1;
}

message GetExpenseVersionResponse {
  // Expense.version as it stands now.
  int32 version = 1;
}

message GetExpenseRequest {
  string expense_id = 1;
  // How many of the newest comments to include; the server clamps it to a
  // sane maximum. 0 includes every comment, as app versions before paging
  // expect.
  int32 comment_limit = 2;
}

message Comment {
  string id = 1;
  string expense_id = 2;
  common.v1.User author = 3;
  string body = 4;
  string created_at = 5;
}

message GetExpenseResponse {
  Expense expense = 1;
  // The newest comments (all of them for comment_limit 0), oldest first.
  repeated Comment comments = 2;
  repeated common.v1.User users = 3;
  // Who has touched this expense, oldest first. Read from the activity feed
  // rather than stored on the expense: the feed already records every change,
  // so a second source of truth would only be one that could disagree.
  repeated ExpenseEvent history = 4;
  // True when nothing is pending for the CALLER from this expense's scope —
  // same rule as ListExpensesResponse.settled_expense_ids, for one expense.
  // Viewer-relative, hence on the response and not on Expense.
  bool settled_for_viewer = 5;
  // True when a settlement was recorded in this expense's scope after the
  // expense was created. Neither editing nor deleting is refused then; the
  // derived balance rebalances against what was already paid, so a
  // participant who paid more than their corrected (or now-deleted) share
  // is owed the difference and one who paid less owes it. Clients use this
  // to warn before either change. Scope-level like settled_for_viewer, but
  // not viewer-relative: the same answer for everyone, so it could live on
  // Expense — it sits here because only the detail view acts on it.
  bool has_later_settlement = 6;
  // Group lifecycle read with the expense snapshot. Clients must hide edit
  // and delete actions while the group is archived. UNSPECIFIED for one-offs.
  group.v1.GroupStatus group_status = 7;
  // Why editing this expense would be refused, in words to show in place of
  // the Edit button; empty when it would not be. Set while somebody on this
  // group expense has left the group: an edit names only members, and
  // dropping them would move a balance nothing can settle again.
  string edit_refusal = 8;
  // Why deleting this expense would be refused, in words to show in place
  // of the Delete button; empty when it would not be. Set when deleting would
  // move the group balance of somebody on it who has left the group.
  string delete_refusal = 9;
  // Pass to ListComments for the comments older than `comments`; empty when
  // there are none.
  string comments_next_cursor = 10;
  // The live split running on this expense; unset when there is none.
  LiveSplit live_split = 11;
}

// One recorded change to an expense, for the detail view's history line.
//
// Deliberately not social.v1.ActivityEvent: that carries a pre-rendered
// message repeating the description and amount, both of which are already on
// screen here, and importing it would tie the expense contract to the social
// one for three fields.
message ExpenseEvent {
  common.v1.User actor = 1;
  // expense_added | expense_updated | expense_deleted
  string type = 2;
  string created_at = 3;
}

message DeleteExpenseRequest {
  string expense_id = 1;
}

message DeleteSettlementRequest {
  string settlement_id = 1;
}

message AddCommentRequest {
  string expense_id = 1;
  string body = 2;
  // A client-generated id (a UUID) naming one attempt at sending this
  // comment, sent unchanged on every retry of it. A retry of a lost response
  // gets the comment the first attempt stored, not a second one. App versions
  // from before this leave it empty.
  string operation_id = 3;
}

message ListCommentsRequest {
  string expense_id = 1;
  // From GetExpenseResponse.comments_next_cursor or a previous next_cursor.
  string cursor = 2;
  // Page size; the server clamps it to a sane maximum.
  int32 limit = 3;
}

message ListCommentsResponse {
  // The page, oldest first; every one is older than the comments already shown.
  repeated Comment comments = 1;
  // Pass back as `cursor` for the comments older still; empty at the first.
  string next_cursor = 2;
}

message RecordSettlementRequest {
  // Group to record the payment in. Empty = pay down balances across scopes:
  // the server splits the amount over the scopes selected below (or every
  // scope holding debt, when none are named) and stores one settlement row
  // per scope, so every balance the pair can see moves together. A debt lives
  // in exactly one scope and each scope's ledger reads only its own rows —
  // recording a payment anywhere else would leave that ledger demanding
  // money that already changed hands.
  string group_id = 1;
  // The other person, whichever way the money moved.
  string to_user_id = 2;
  int64 amount_cents = 3;
  // The currency the money moved in. A group payment is always in the
  // group's currency (a different one is refused); a cross-scope payment
  // pays down only balances in this currency, and a selected scope in
  // another currency is refused rather than converted. Empty = the caller's
  // default currency.
  string currency = 4;
  string method = 5; // venmo | zelle | cashapp | paypal | cash | bank | other
  string note = 6;
  // false (default) = you paid them; true = they paid you, and the settlement
  // is stored the other way round. Recording money coming back to you is the
  // only way to clear a balance in your favour.
  bool received = 7;
  // Which scopes this payment addresses, when group_id is empty: group ids,
  // with "" naming the pair's one-off ledger. The payer picks these in the
  // settle dialog (all on by default). Empty = every scope where the payer
  // owes — which is also what clients predating this field send, so the
  // default and the legacy behavior are the same thing.
  repeated string scope_group_ids = 8;
  // Required. A client-generated id naming this one attempt at recording
  // the payment; same contract as CreateExpenseRequest.operation_id. The
  // retry of a lost response gets the recording the first attempt made,
  // never a second one.
  string operation_id = 9;
  // Settle the pair on their net in this currency, across every scope. Only
  // with an empty group_id and no scope_group_ids. Two people can owe each
  // other in different scopes at once (you owe them outside groups, they owe
  // you inside two), and every list shows the pair as the net of both. With
  // this set, amount_cents is the cash that moves — at most that net — and
  // the server also records the offsetting entries that cancel the balances
  // pointing the other way against what the payer owes, so every scope the
  // pair shares in this currency moves together and a full payment leaves
  // all of them at zero. Refused when the payer is not behind overall.
  bool net_across_scopes = 10;
  // Required with net_across_scopes: the digest of the SettlePosition the
  // person was shown (FriendLedgerResponse.settle_positions). The server
  // recomputes the position under its locks and refuses the settlement when
  // the digests differ, so what gets cancelled is exactly what was on screen
  // and never a ledger that moved underneath it.
  string position_digest = 11;
  // The payment method the money moved through: one of the methods of
  // whoever received it (the other person's when paying them, the caller's
  // own when recording money received). Optional. When it names such a
  // method, the server records the payment under that method's key and
  // copies its name onto the settlement, and `method` is ignored. An id that
  // does not resolve, because the method was removed or was never theirs,
  // never fails the payment: it is recorded from `method` with no name.
  string payment_method_id = 12;
}

message Settlement {
  string id = 1;
  string group_id = 2;
  string from_user_id = 3;
  string to_user_id = 4;
  int64 amount_cents = 5;
  string currency = 6;
  string method = 7;
  string note = 8;
  string created_at = 9;
  // The authenticated user who typed the payment in: one of the two people
  // on it, not necessarily the payer. A payment is a claim; this says whose.
  string recorded_by_user_id = 10;
  // Name of the payment method used, e.g. "bKash", as it was called when the
  // payment was recorded. A copy: renaming or removing the method later does
  // not change it. Empty for cash and for payments recorded without one.
  string method_label = 11;
}

message GetGroupBalancesRequest {
  string group_id = 1;
}

message BalancesResponse {
  // The group's own currency only, kept for clients from before
  // `by_currency`; `by_currency` carries it too, first.
  repeated common.v1.NetBalance nets = 1;
  // Raw pairwise debts derived from expenses minus settlements.
  repeated common.v1.Debt debts = 2;
  // Min-cash-flow simplification of the same balances.
  repeated common.v1.Debt simplified = 3;
  // The group's balances in each currency it holds money in, the group's
  // own currency first (every member listed, even at zero) and then any
  // other, alphabetically (only those with something outstanding). A group's
  // rows are in its currency today; a group holding a payment recorded in
  // another one before that rule keeps it as a balance of its own. Nothing
  // here is added across currencies.
  repeated GroupCurrencyBalances by_currency = 4;
}

// One currency's balances in a group.
message GroupCurrencyBalances {
  string currency = 1;
  repeated common.v1.NetBalance nets = 2;
  repeated common.v1.Debt debts = 3;
  repeated common.v1.Debt simplified = 4;
}

// Totals in one currency across every counterparty.
message CurrencyTotals {
  string currency = 1;
  int64 you_owe_cents = 2;
  int64 owed_to_you_cents = 3;
}

message OverallBalancesResponse {
  // Totals in the caller's default currency only, kept for older clients;
  // `totals` carries every currency.
  int64 you_owe_cents = 1;
  int64 owed_to_you_cents = 2;
  repeated common.v1.CounterpartyBalance counterparties = 3;
  // One entry per currency with anything outstanding, the caller's default
  // first. Never summed across currencies.
  repeated CurrencyTotals totals = 4;
}

message GetFriendLedgerRequest {
  string user_id = 1;
  // Statement lines in `entries`, newest first; the server clamps it to a
  // sane maximum. 0 returns up to 300 with `truncated`, the shape app
  // versions before paging read.
  int32 limit = 2;
}

message ListFriendLedgerEntriesRequest {
  string user_id = 1;
  // From FriendLedgerResponse.next_cursor or a previous next_cursor. It
  // carries the running balance the page continues from, signed, and is
  // good only for this caller and this friend.
  string cursor = 2;
  // Page size; the server clamps it to a sane maximum.
  int32 limit = 3;
}

message ListFriendLedgerEntriesResponse {
  // Older lines, newest first, each balance continuing from the last page.
  repeated FriendLedgerEntry entries = 1;
  // Pass back as `cursor` for the lines older still; empty at the first.
  string next_cursor = 2;
}

// One line of the shared history with a friend. Positive cents always mean
// "in your favour", so the signs read the same way down the whole statement.
message FriendLedgerEntry {
  string kind = 1; // expense | settlement
  string id = 2;
  string date = 3; // YYYY-MM-DD
  string description = 4;
  string group_id = 5; // empty = one-off
  string group_name = 6;
  // The whole expense, or the amount that changed hands for a settlement.
  int64 total_cents = 7;
  // What this line did to the balance: > 0 = they owe you more.
  int64 delta_cents = 8;
  // The balance after this line, oldest to newest: > 0 = they owe you.
  int64 balance_after_cents = 9;
  // Full timestamp for lines that record a moment (settlements); empty for
  // expenses, whose `date` is the calendar day the user chose. The moment is
  // stored in UTC, and only the client knows the viewer's timezone — so the
  // client renders it, and `date` (the UTC day) is just the fallback.
  string created_at = 10;
  // True for an expense or settlement line that has since been deleted. It
  // stays in the history with delta_cents = 0 — it no longer moves the
  // balance — so a payment made against a deleted expense, or a debt that
  // came back when a mistaken payment was removed, still has the row that
  // explains it.
  bool deleted = 11;
  // For a settlement line, who typed it in — "you", or the friend's name.
  // Either person may record a payment either way round, so the statement
  // names the asserter on every payment line. Empty for expense lines.
  string recorded_by_name = 12;
  // ISO 4217 code of total_cents, delta_cents and balance_after_cents. The
  // running balance runs per currency: a euro line continues the euro
  // column, not the dollar one.
  string currency = 13;
  // For a settlement line that is part of a net settlement: the id its lines
  // share. They are removed together, never one at a time. Empty for an
  // ordinary payment and for expense lines.
  string net_settlement_id = 14;
  // True for a net settlement's cancelling line: no money moved, a balance
  // here was cancelled against one pointing the other way. It has no remove
  // of its own; removing the payment it belongs to removes it too.
  bool offset = 15;
  // For a settlement line: why removing it would be refused, in words to
  // show in place of its Remove action; empty when it would not be. Set when
  // the payment (or any line of its net settlement) is in a group one of the
  // two has since left: removing it would reopen a balance nothing can settle.
  string removal_refusal = 16;
}

// One balance two people share, inside a settle position.
message SettleScope {
  string group_id = 1; // empty = the pair's one-off slate
  string group_name = 2;
  int64 net_cents = 3; // > 0 = they owe you here
  bool simplified = 4;
}

// Everything two people can settle between them in one currency, computed
// by the same code that records a settlement: every scope they share, each
// routed the way that scope routes debt, and the net of them. This, not the
// statement history, is what a settle dialog for a person shows.
message SettlePosition {
  string currency = 1;
  // The net across the scopes: > 0 = they owe you.
  int64 net_cents = 2;
  repeated SettleScope scopes = 3;
  // Fingerprint of this position, to send back as
  // RecordSettlementRequest.position_digest.
  string digest = 4;
}

message FriendGroupBalance {
  string group_id = 1;
  string group_name = 2;
  int64 net_cents = 3; // > 0 = they owe you in this group
  // True when this group simplifies debts, making net_cents the *routed*
  // amount between the pair rather than their direct dealings — possibly
  // zero while the pair's shared history is not, or vice versa. Surfaced so
  // the UI can say why a group's number differs from the history.
  bool simplified = 4;
  // ISO 4217 code of net_cents: a group's own currency, or, for the one-off
  // slate (group_id empty), the currency of that bucket — the pair's direct
  // dealings are one entry per currency.
  string currency = 5;
}

// One group both people belong to, regardless of balance.
message MutualGroup {
  string group_id = 1;
  string group_name = 2;
  string group_type = 3;
}

message FriendLedgerResponse {
  common.v1.User friend = 1;
  // The net in the caller's default currency only (`currency`), kept for
  // older clients: > 0 = they owe you. `nets` is the whole picture.
  int64 net_cents = 2;
  string currency = 3;
  // Net across everything shared, groups included, one entry per currency
  // with anything outstanding: cents > 0 = they owe you.
  repeated common.v1.CurrencyAmount nets = 9;
  // Newest first, which is the reading order; balance_after_cents is
  // accumulated oldest-first so the topmost entry carries the current net.
  repeated FriendLedgerEntry entries = 4;
  // Only the groups you actually share with this person, and only when the
  // balance is spread across more than a single scope.
  repeated FriendGroupBalance group_balances = 5;
  // Whether the CALLER has an explicit friendship with this person. The page
  // also works for mutual group members and historical expense counterparties,
  // so it has to say which relationship it is showing.
  bool is_friend = 6;
  // Every group both belong to — unlike group_balances, a settled group
  // still appears, because "where do I know this person from" is a different
  // question from "where does money move between us".
  repeated MutualGroup mutual_groups = 7;
  // Set only for a request with limit 0: true when older lines were left off
  // `entries`. Paging clients read next_cursor instead.
  // The nets and group balances are computed over everything regardless.
  bool truncated = 10 [deprecated = true];
  // One entry per currency in which the pair has anything to settle.
  repeated SettlePosition settle_positions = 11;
  // How this person wants to be paid: every payment method of theirs, oldest
  // first. Filled only while the caller owes them something, in any currency
  // and in any one scope, since a single balance can be settled on its own
  // even when the pair's net points the other way. Empty otherwise: an
  // account number is for the person about to use it, and nobody else. This
  // response is the only way one person's methods reach another.
  repeated payment.v1.PaymentMethod payee_methods = 12;
  // The server's clock when this was read (ISO 8601). A client works out
  // "changed 2 days ago" against this, not against its own clock, which can
  // be wrong by minutes or by years, and wrong in the direction that hides
  // the freshest change.
  string read_at = 13;
  // When this person last removed one of their payment methods; empty when
  // they never have, and whenever payee_methods is empty. With it, a method
  // added in place of a removed one is not mistaken for one that is merely
  // new.
  string payee_method_removed_at = 14;
  // Pass to ListFriendLedgerEntries for the lines older than `entries`;
  // empty when there are none.
  string next_cursor = 15;
}
