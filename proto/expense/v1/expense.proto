syntax = "proto3";

package expense.v1;

import "google/protobuf/empty.proto";
import "common/v1/common.proto";

// Expenses, settlements and balances. All money is integer cents in the
// expense's currency; splits always reconcile to the exact total.
service ExpenseService {
  rpc CreateExpense(CreateExpenseRequest) returns (Expense);
  // Anyone on the expense — creator, payer or ower — may correct it; the
  // "updated" activity tells the rest. Allowed after a settlement in the
  // scope (the balance rebalances against what was paid). An expense cannot
  // be moved between scopes.
  rpc UpdateExpense(UpdateExpenseRequest) returns (Expense);
  rpc ListExpenses(ListExpensesRequest) returns (ListExpensesResponse);
  rpc GetExpense(GetExpenseRequest) returns (GetExpenseResponse);
  // Creator only. A soft delete: the expense stops counting toward every
  // balance but stays visible everywhere the ledger is shown, marked deleted
  // (Expense.deleted_at), and payments already recorded against it stay on
  // the ledger — so deleting a paid-for expense leaves the payer owed a
  // refund, with the struck-through row explaining why.
  rpc DeleteExpense(DeleteExpenseRequest) returns (google.protobuf.Empty);
  rpc AddComment(AddCommentRequest) returns (Comment);

  rpc RecordSettlement(RecordSettlementRequest) returns (Settlement);
  rpc GetGroupBalances(GetGroupBalancesRequest) returns (BalancesResponse);
  rpc GetOverallBalances(google.protobuf.Empty) returns (OverallBalancesResponse);
  rpc GetFriendLedger(GetFriendLedgerRequest) returns (FriendLedgerResponse);
}

message Payer {
  string user_id = 1;
  int32 amount_cents = 2;
}

message Split {
  string user_id = 1;
  int32 owed_cents = 2;
}

// Per-participant input for the chosen split type. Only the field matching
// the split type is read: exact -> amount_cents, percent -> percent_bp
// (basis points, must sum to 10000), shares -> shares. equal ignores all.
message SplitSpec {
  string user_id = 1;
  int32 amount_cents = 2;
  int32 percent_bp = 3;
  int32 shares = 4;
}

message ItemAssignment {
  string user_id = 1;
  int32 weight = 2;
}

message ExpenseItem {
  string id = 1;
  string name = 2;
  int32 quantity = 3;
  int32 total_cents = 4;
  repeated ItemAssignment assignments = 5;
}

message Expense {
  string id = 1;
  string group_id = 2; // empty = one-off (non-group) expense
  string description = 3;
  int32 amount_cents = 4;
  string currency = 5;
  string category = 6;
  string expense_date = 7; // YYYY-MM-DD
  string split_type = 8;   // equal | exact | percent | shares | itemized
  string notes = 9;
  string created_by = 10;
  string created_at = 11;
  repeated Payer payers = 12;
  repeated Split splits = 13;
  repeated ExpenseItem items = 14;
  int32 tax_cents = 15;
  int32 tip_cents = 16;
  // When the expense was deleted; empty while it is live. A deleted expense
  // is still returned by list and detail reads so history stays legible —
  // and stays open to comments, since "why was this removed?" is the
  // conversation the kept row exists to host — but contributes nothing to
  // any balance, cannot be edited, and is never reported as settled.
  string deleted_at = 17;
}

message CreateExpenseRequest {
  string group_id = 1; // empty = one-off
  string description = 2;
  int32 amount_cents = 3;
  string currency = 4;
  string category = 5;
  string expense_date = 6;
  string split_type = 7;
  string notes = 8;
  repeated Payer payers = 9;       // must sum to amount_cents
  repeated SplitSpec split_specs = 10;
  repeated ExpenseItem items = 11; // itemized only; ids may be empty
  int32 tax_cents = 12;            // itemized only
  int32 tip_cents = 13;            // itemized only
}

message UpdateExpenseRequest {
  string expense_id = 1;
  CreateExpenseRequest expense = 2;
}

message ListExpensesRequest {
  // Exactly one of these; both empty = all expenses involving the caller.
  string group_id = 1;
  string with_user_id = 2; // one-off expenses with this user
}

message ListExpensesResponse {
  repeated Expense expenses = 1;
  repeated common.v1.User users = 2; // everyone referenced by the expenses
  // Ids of listed expenses with nothing pending for the CALLER: their balance
  // in the expense's scope — the group, or the pair ledger with each other
  // participant for a one-off — is zero. Viewer-relative, which is why it is
  // a side list here and not a field on Expense. Scope-level on purpose:
  // settlements pay down a scope's balance, not a specific expense, so while
  // a scope still owes, singling out one of its expenses as "settled" would
  // be an attribution the ledger never made.
  repeated string settled_expense_ids = 3;
}

message GetExpenseRequest {
  string expense_id = 1;
}

message Comment {
  string id = 1;
  string expense_id = 2;
  common.v1.User author = 3;
  string body = 4;
  string created_at = 5;
}

message GetExpenseResponse {
  Expense expense = 1;
  repeated Comment comments = 2;
  repeated common.v1.User users = 3;
  // Who has touched this expense, oldest first. Read from the activity feed
  // rather than stored on the expense: the feed already records every change,
  // so a second source of truth would only be one that could disagree.
  repeated ExpenseEvent history = 4;
  // True when nothing is pending for the CALLER from this expense's scope —
  // same rule as ListExpensesResponse.settled_expense_ids, for one expense.
  // Viewer-relative, hence on the response and not on Expense.
  bool settled_for_viewer = 5;
  // True when a settlement was recorded in this expense's scope after the
  // expense was created. Neither editing nor deleting is refused then; the
  // derived balance rebalances against what was already paid, so a
  // participant who paid more than their corrected (or now-deleted) share
  // is owed the difference and one who paid less owes it. Clients use this
  // to warn before either change. Scope-level like settled_for_viewer, but
  // not viewer-relative: the same answer for everyone, so it could live on
  // Expense — it sits here because only the detail view acts on it.
  bool has_later_settlement = 6;
}

// One recorded change to an expense, for the detail view's history line.
//
// Deliberately not social.v1.ActivityEvent: that carries a pre-rendered
// message repeating the description and amount, both of which are already on
// screen here, and importing it would tie the expense contract to the social
// one for three fields.
message ExpenseEvent {
  common.v1.User actor = 1;
  // expense_added | expense_updated | expense_deleted
  string type = 2;
  string created_at = 3;
}

message DeleteExpenseRequest {
  string expense_id = 1;
}

message AddCommentRequest {
  string expense_id = 1;
  string body = 2;
}

message RecordSettlementRequest {
  // Group to record the payment in. Empty = pay down balances across scopes:
  // the server splits the amount over the scopes selected below (or every
  // scope holding debt, when none are named) and stores one settlement row
  // per scope, so every balance the pair can see moves together. A debt lives
  // in exactly one scope and each scope's ledger reads only its own rows —
  // recording a payment anywhere else would leave that ledger demanding
  // money that already changed hands.
  string group_id = 1;
  // The other person, whichever way the money moved.
  string to_user_id = 2;
  int32 amount_cents = 3;
  string currency = 4;
  string method = 5; // venmo | zelle | cashapp | paypal | cash | bank | other
  string note = 6;
  // false (default) = you paid them; true = they paid you, and the settlement
  // is stored the other way round. Recording money coming back to you is the
  // only way to clear a balance in your favour.
  bool received = 7;
  // Which scopes this payment addresses, when group_id is empty: group ids,
  // with "" naming the pair's one-off ledger. The payer picks these in the
  // settle dialog (all on by default). Empty = every scope where the payer
  // owes — which is also what clients predating this field send, so the
  // default and the legacy behavior are the same thing.
  repeated string scope_group_ids = 8;
}

message Settlement {
  string id = 1;
  string group_id = 2;
  string from_user_id = 3;
  string to_user_id = 4;
  int32 amount_cents = 5;
  string currency = 6;
  string method = 7;
  string note = 8;
  string created_at = 9;
}

message GetGroupBalancesRequest {
  string group_id = 1;
}

message BalancesResponse {
  repeated common.v1.NetBalance nets = 1;
  // Raw pairwise debts derived from expenses minus settlements.
  repeated common.v1.Debt debts = 2;
  // Min-cash-flow simplification of the same balances.
  repeated common.v1.Debt simplified = 3;
}

message OverallBalancesResponse {
  int32 you_owe_cents = 1;
  int32 owed_to_you_cents = 2;
  repeated common.v1.CounterpartyBalance counterparties = 3;
}

message GetFriendLedgerRequest {
  string user_id = 1;
}

// One line of the shared history with a friend. Positive cents always mean
// "in your favour", so the signs read the same way down the whole statement.
message FriendLedgerEntry {
  string kind = 1; // expense | settlement
  string id = 2;
  string date = 3; // YYYY-MM-DD
  string description = 4;
  string group_id = 5; // empty = one-off
  string group_name = 6;
  // The whole expense, or the amount that changed hands for a settlement.
  int32 total_cents = 7;
  // What this line did to the balance: > 0 = they owe you more.
  int32 delta_cents = 8;
  // The balance after this line, oldest to newest: > 0 = they owe you.
  int32 balance_after_cents = 9;
  // Full timestamp for lines that record a moment (settlements); empty for
  // expenses, whose `date` is the calendar day the user chose. The moment is
  // stored in UTC, and only the client knows the viewer's timezone — so the
  // client renders it, and `date` (the UTC day) is just the fallback.
  string created_at = 10;
  // True for an expense line that has since been deleted. It stays in the
  // history with delta_cents = 0 — it no longer moves the balance — so a
  // payment made against it still has the row that explains it.
  bool deleted = 11;
}

message FriendGroupBalance {
  string group_id = 1;
  string group_name = 2;
  int32 net_cents = 3; // > 0 = they owe you in this group
  // True when this group simplifies debts, making net_cents the *routed*
  // amount between the pair rather than their direct dealings — possibly
  // zero while the pair's shared history is not, or vice versa. Surfaced so
  // the UI can say why a group's number differs from the history.
  bool simplified = 4;
}

// One group both people belong to, regardless of balance.
message MutualGroup {
  string group_id = 1;
  string group_name = 2;
  string group_type = 3;
}

message FriendLedgerResponse {
  common.v1.User friend = 1;
  // Net across everything shared, groups included: > 0 = they owe you.
  int32 net_cents = 2;
  string currency = 3;
  // Newest first, which is the reading order; balance_after_cents is
  // accumulated oldest-first so the topmost entry carries the current net.
  repeated FriendLedgerEntry entries = 4;
  // Only the groups you actually share with this person, and only when the
  // balance is spread across more than a single scope.
  repeated FriendGroupBalance group_balances = 5;
  // Whether the CALLER has an explicit friendship with this person. The page
  // also works for mutual group members and historical expense counterparties,
  // so it has to say which relationship it is showing.
  bool is_friend = 6;
  // Every group both belong to — unlike group_balances, a settled group
  // still appears, because "where do I know this person from" is a different
  // question from "where does money move between us".
  repeated MutualGroup mutual_groups = 7;
}
