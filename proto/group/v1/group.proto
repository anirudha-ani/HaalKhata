syntax = "proto3";

package group.v1;

import "google/protobuf/empty.proto";
import "common/v1/common.proto";

service GroupService {
  rpc CreateGroup(CreateGroupRequest) returns (Group);
  rpc ListGroups(google.protobuf.Empty) returns (ListGroupsResponse);
  rpc GetGroup(GetGroupRequest) returns (Group);
  // Adds people to a group in one call. Anyone you already know goes in by
  // id; email/phone may identify an existing connected account. Cold invites
  // need an acceptance flow and are rejected until one exists. Any member may
  // call this; only the owner may remove somebody else, while a zero-balance
  // non-owner may remove themselves.
  rpc AddMembers(AddMembersRequest) returns (AddMembersResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty);
  // Turns debt simplification on or off for the whole group. Any member may
  // flip it (the same trust level as adding people): it is a routing mode
  // over balances that stay fully derived, so it rewrites nothing and is
  // always safe to change. The server's settlement guards follow the mode,
  // which is why it must be a shared group fact and not a per-viewer view:
  // two debt routings live at once would let one debt be paid down both.
  rpc SetSimplifyDebts(SetSimplifyDebtsRequest) returns (Group);
}

message Member {
  common.v1.User user = 1;
  string role = 2; // "owner" | "member"
}

message Group {
  string id = 1;
  string name = 2;
  string type = 3; // "trip" | "home" | "couple" | "other"
  string currency = 4;
  string created_by = 5;
  string created_at = 6;
  repeated Member members = 7;
  // When true, this group's debts are routed as the min-cash-flow
  // simplification of member nets rather than the raw pairwise graph —
  // everywhere: the balances tab, friend ledgers, the dashboard, and what
  // the settlement guards will accept.
  bool simplify_debts = 8;
}

message CreateGroupRequest {
  string name = 1;
  string type = 2;
  string currency = 3;
  // People to enrol alongside the creator, so a group can be born populated
  // instead of empty-then-invited. Same authorization rule as AddMembers.
  repeated string member_ids = 4;
}

message GroupSummary {
  Group group = 1;
  int32 member_count = 2;
  // The calling user's net position in the group.
  int32 your_net_cents = 3;
}

message ListGroupsResponse {
  repeated GroupSummary groups = 1;
}

message GetGroupRequest {
  string group_id = 1;
}

message AddMembersRequest {
  string group_id = 1;
  // Ids of people the caller already knows. Each must be an existing friend
  // or someone the caller already shares a group with — a bare id is not
  // authorization, or a stranger's id would be enough to enrol them in your
  // group and start attributing debts to them.
  repeated string user_ids = 2;
  // Email of somebody not on that list yet; a shadow user is created when no
  // account matches. At most one of email/phone, following the identifier
  // split in §4b.
  string email = 3;
  // Phone as the alternative to email: E.164, or a US national format.
  string phone = 4;
  // Optional display name used when a shadow user must be created.
  string name = 5;
}

message AddMembersResponse {
  // Only the people this call actually added. Someone already in the group is
  // skipped rather than failing the batch, so one stale checkbox cannot lose
  // the other four additions.
  repeated Member added = 1;
}

message RemoveMemberRequest {
  string group_id = 1;
  string user_id = 2;
}

message SetSimplifyDebtsRequest {
  string group_id = 1;
  // Desired state; setting the state it is already in is a no-op, not an
  // error, so two members flipping it together cannot fail each other.
  bool simplify = 2;
}
