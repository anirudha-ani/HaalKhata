syntax = "proto3";

package receipt.v1;

// AI receipt itemization. The server tries configured providers in order
// (self-hosted vision box, cloud API, mock) and returns a normalized draft
// that the user reviews before it becomes an itemized expense — AI output
// is never auto-committed.
service ReceiptService {
  rpc ParseReceipt(ParseReceiptRequest) returns (ParseReceiptResponse);
}

message ParseReceiptRequest {
  bytes image = 1;
  // Advisory only. The server detects the real format from the image bytes,
  // because browsers report an empty string for HEIC and would otherwise make
  // a valid iPhone photo unusable.
  string media_type = 2;
}

message ParsedReceiptItem {
  string name = 1;
  int32 quantity = 2;
  int32 unit_price_cents = 3;
  int32 total_cents = 4;
}

message ParsedReceipt {
  string merchant = 1;
  string date = 2; // YYYY-MM-DD or empty
  string currency = 3;
  repeated ParsedReceiptItem items = 4;
  int32 subtotal_cents = 5;
  int32 tax_cents = 6;
  int32 tip_cents = 7;
  int32 total_cents = 8;
}

message ParseReceiptResponse {
  ParsedReceipt receipt = 1;
  // Which provider produced the result: "compatible" | "mock".
  string provider = 2;
  // The exact JPEG the provider was shown — the upload after EXIF rotation,
  // downscaling and (for iPhone photos) HEIC transcoding. Returned so the
  // client can display the receipt next to the extracted values for checking:
  // browsers cannot decode HEIC, so the original upload is not renderable, and
  // this is also what the model actually read. Never stored server-side.
  bytes normalized_image = 3;
}
