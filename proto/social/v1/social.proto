syntax = "proto3";

package social.v1;

import "google/protobuf/empty.proto";
import "common/v1/common.proto";

// Friends, the activity feed and in-app notifications.
service SocialService {
  // Sends a privacy-preserving friend request. The returned User is kept for
  // wire compatibility and intentionally carries no target fields: callers
  // must not learn whether an email, phone, or id resolved to an account.
  rpc AddFriend(AddFriendRequest) returns (common.v1.User);
  rpc ListFriends(google.protobuf.Empty) returns (ListFriendsResponse);
  // Accepts or declines an incoming request; only the named recipient can act.
  rpc RespondFriendRequest(RespondFriendRequestRequest) returns (google.protobuf.Empty);
  // Withdraws a request the caller sent that is still pending. Named the way
  // it was shown in outgoing_requests: by the recipient's id when they were
  // picked, or by the typed identifier when they were not, so cancelling
  // never needs (or reveals) the account behind an email or phone.
  rpc CancelFriendRequest(CancelFriendRequestRequest) returns (google.protobuf.Empty);
  // Ends a friendship. Refused (FailedPrecondition) while any balance with
  // that person, in any currency, is outstanding: removal must not orphan
  // debt. Quiet like group removal (no notification); shared history and
  // group co-memberships are untouched, and they can be re-added later.
  rpc RemoveFriend(RemoveFriendRequest) returns (google.protobuf.Empty);

  // Find friends from contacts. Says which identifiers from the caller's own
  // address book belong to registered accounts that are findable: the
  // default, until the person turns it off
  // (auth.v1.AuthService.SetContactDiscovery). Unlike AddFriend this does
  // reveal a match, which is why an account that said no never takes part,
  // and a phone matches only once its holder verified it. The server stores
  // none of what it is sent. Limited per minute and per day; past either it
  // fails with ResourceExhausted and a message the client can show.
  rpc FindContacts(FindContactsRequest) returns (FindContactsResponse);
  // Sends a friend request to each listed account, with AddFriend's rules
  // applied per id: the caller, blocked, unregistered or merged accounts,
  // existing friends and pairs with a request pending in either direction
  // are skipped without saying so. So are accounts that are not findable
  // from contacts, which keeps this bulk path from being a faster AddFriend
  // for ids learned elsewhere. One call takes one rate-limit slot. The apps
  // send one id per call, from that person's Add (App Review 5.1.2(v) rules
  // out a select-all over contacts). The recipients appear in
  // ListFriends.outgoing_requests with their profile, since the caller saw
  // who they were asking.
  rpc SendFriendRequests(SendFriendRequestsRequest) returns (google.protobuf.Empty);

  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);
  rpc ListNotifications(google.protobuf.Empty) returns (ListNotificationsResponse);
  rpc MarkNotificationsRead(google.protobuf.Empty) returns (google.protobuf.Empty);
  // Nudges someone who owes the caller money. Rate-limited server-side so it
  // cannot become a way to harass somebody.
  rpc SendReminder(SendReminderRequest) returns (google.protobuf.Empty);

  // Invite links. Nobody is invited by email or phone: a person who has not
  // signed up does not exist here, and nothing is created for them. They are
  // reached through a group's join link or a person's own profile link and
  // sign up as themselves; accepting a link never claims or merges anything.

  // Retired with one-person invite links, which claimed a placeholder made
  // for somebody who had not signed up. Always refused with
  // FAILED_PRECONDITION; kept so installed apps get an answer they can show.
  rpc GetFriendInviteLink(GetFriendInviteLinkRequest) returns (InviteLink) {
    option deprecated = true;
  }
  // Retired for the same reason: it made a placeholder for a contact and
  // returned the link that claimed it. Always refused with
  // FAILED_PRECONDITION; a group's join link or GetProfileInviteLink is
  // shared instead.
  rpc InviteContactToSignUp(InviteContactRequest) returns (InviteLink) {
    option deprecated = true;
  }
  // The group's one active join link, created on first ask. Any member may
  // — the same trust level as adding people directly. A link works for 7
  // days; asking again returns it unchanged until then, and a new one after.
  rpc CreateGroupInviteLink(CreateGroupInviteLinkRequest) returns (InviteLink);
  // Disables the group's active link; a fresh one can be created after.
  // Owner only: revocation invalidates a link every member may have shared.
  rpc RevokeGroupInviteLink(RevokeGroupInviteLinkRequest) returns (google.protobuf.Empty);
  // The caller's own shareable "add me" link, minted on first ask. Accepting
  // it sends the owner an ordinary friend request — the link removes the
  // typing, not the consent: a bearer string that leaks must not let a
  // stranger attach themselves (and future one-off expenses) to the owner.
  rpc GetProfileInviteLink(google.protobuf.Empty) returns (InviteLink);
  // Disables the caller's profile link; the next ask mints a fresh one.
  rpc RevokeProfileInviteLink(google.protobuf.Empty) returns (google.protobuf.Empty);
  // UNAUTHENTICATED. What a clicked link offers — who invited you, to what —
  // so the landing page can say it before asking anyone to sign in.
  // Possession of the unguessable token is the only credential; the call is
  // rate-limited by client address. A group link past its date answers
  // FAILED_PRECONDITION (and so does accepting it); any other unusable token
  // answers NOT_FOUND.
  rpc PreviewInviteLink(PreviewInviteLinkRequest) returns (InvitePreview);
  // Accepts a link as the signed-in caller: a group link joins the group and
  // befriends the inviter, a profile link sends its owner a friend request.
  // Safe to repeat.
  rpc AcceptInviteLink(AcceptInviteLinkRequest) returns (AcceptInviteLinkResponse);
}

message SendReminderRequest {
  // The person to remind; must currently owe the caller.
  string user_id = 1;
}

message AddFriendRequest {
  // Exactly one of email/phone/user_id identifies the recipient; phone is E.164.
  string email = 1;
  string name = 2; // legacy field; ignored because nothing is created for a stranger
  string phone = 3;
  // An existing account by id — for requesting someone already on screen.
  string user_id = 4;
}

message RemoveFriendRequest {
  string user_id = 1;
}

message RespondFriendRequestRequest {
  // Existing incoming request's sender. Unknown/non-incoming ids are rejected.
  string user_id = 1;
  // True accepts and creates the symmetric friendship; false declines it.
  bool accept = 2;
}

message CancelFriendRequestRequest {
  // Exactly one of user_id/identifier, matching how the pending request was
  // shown to the caller.
  string user_id = 1;
  string identifier = 2;
}

message ListFriendsResponse {
  repeated common.v1.CounterpartyBalance friends = 1;
  // Pending senders visible only to this recipient. Contact details and
  // payment handles are withheld until the request is accepted.
  repeated common.v1.User incoming_requests = 2;
  // Requests the caller sent that are still waiting on the recipient, oldest
  // first. Each echoes only what the caller already knew when sending.
  repeated OutgoingFriendRequest outgoing_requests = 3;
}

// One friend request the caller sent that has not been answered yet. Exactly
// one of user/identifier is set: a pending request must not turn into a
// lookup that tells the caller whose account an email or phone belongs to.
message OutgoingFriendRequest {
  // The recipient, when the caller picked them by id (someone already on
  // screen, such as a group member) or reached them through their profile
  // link. Minimal projection, as for incoming requests.
  common.v1.User user = 1;
  // The email or phone the caller typed, when the request was sent that way.
  // Echoed back, never resolved.
  string identifier = 2;
  // RFC 3339 timestamp of when the request was sent.
  string created_at = 3;
}

message ListActivityRequest {
  string group_id = 1; // empty = everything visible to the caller
  // Opaque cursor from the previous response's next_cursor; empty starts at
  // the newest event. Keyset rather than offset, so rows inserted while you
  // page cannot shift the window and duplicate or skip an entry.
  string cursor = 2;
  // Page size; the server clamps it to a sane maximum.
  int32 limit = 3;
  // "YYYY-MM" to restrict the feed to one calendar month; empty for all time.
  string month = 4;
}

message ActivityEvent {
  string id = 1;
  string group_id = 2;
  common.v1.User actor = 3;
  string type = 4;    // expense_added | expense_updated | expense_deleted | settlement | member_added | group_created | comment
  string message = 5; // pre-rendered, human-readable
  string link = 6;    // app path, e.g. /expenses/<id>
  string created_at = 7;
  // The money this event concerned; 0 when it concerned none.
  int64 amount_cents = 8;
  string currency = 9;
  // Whether this event moved money toward the reader — settlements only.
  // Computed per viewer, so the same row is inbound for one person and not
  // for the other; without it the UI cannot tell "you were paid" from "you
  // paid" and would show one icon for both.
  bool inbound = 10;
}

message ListActivityResponse {
  repeated ActivityEvent events = 1;
  // Pass back as `cursor` for the next page; empty when the feed is exhausted.
  string next_cursor = 2;
  // Months ("YYYY-MM", newest first) that actually contain activity, for the
  // filter — an open date picker would offer thousands of empty months.
  // Reflects the group scope but not the month filter, so the control does
  // not erase its own options.
  repeated string months = 3;
}

message Notification {
  string id = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  string link = 5;
  bool read = 6;
  string created_at = 7;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  int32 unread_count = 2;
  // Friend requests waiting for the caller's answer, for a badge on the
  // Friends tab. Carried here because clients already poll this call for the
  // bell; ListFriends computes the full-ledger aggregate and shares its rate
  // limit with the balances, so it is the wrong thing to poll.
  int32 pending_friend_request_count = 3;
}

// Request of the retired GetFriendInviteLink.
message GetFriendInviteLinkRequest {
  string user_id = 1;
}

message CreateGroupInviteLinkRequest {
  string group_id = 1;
}

message RevokeGroupInviteLinkRequest {
  string group_id = 1;
}

message InviteLink {
  // Opaque bearer token. Clients compose the shareable URL as
  // https://haalkhata.app/join/<token>; the server never builds URLs so the
  // link origin stays a client concern.
  string token = 1;
  // When a group's join link stops working (RFC 3339, UTC), for the share
  // dialog to say. Empty for a profile link, which does not expire.
  string expires_at = 2;
}

message PreviewInviteLinkRequest {
  string token = 1;
}

message InvitePreview {
  string kind = 1; // "group" | "profile"
  string inviter_name = 2;
  // Group links only.
  string group_name = 3;
  int32 member_count = 4;
  // Retired with one-person links; always empty.
  string invited_name = 5 [deprecated = true];
}

message AcceptInviteLinkRequest {
  string token = 1;
}

message AcceptInviteLinkResponse {
  // Set for a group link so the client can land on the group afterwards.
  string group_id = 1;
}

// Request of the retired InviteContactToSignUp.
message InviteContactRequest {
  string email = 1;
  string phone = 2;
}

message FindContactsRequest {
  // E.164 numbers, normalised on the device. Phones and emails together
  // may hold at most 1,000 entries; the client sends a larger address book
  // in several calls. Entries that are not valid numbers are ignored.
  repeated string phones = 1;
  // Email addresses, trimmed and lower-cased on the device. Entries that are
  // not addresses are ignored.
  repeated string emails = 2;
}

message FindContactsResponse {
  // One entry per submitted identifier that matched; an account that holds
  // two submitted identifiers appears twice, once for each.
  repeated FoundContact contacts = 1;
  // Identifiers the caller can still check today (UTC).
  int32 remaining_today = 2;
}

// One identifier from the request that belongs to a findable account.
message FoundContact {
  // The phone or email from the request that matched, exactly as sent, so
  // the client can show the contact's own name beside the account. Never an
  // identifier the caller did not send.
  string identifier = 1;
  // Minimal projection, as for incoming requests: id, name and avatar.
  common.v1.User user = 2;
  ContactRelation relation = 3;
}

// Where the caller stands with a found account.
enum ContactRelation {
  CONTACT_RELATION_UNSPECIFIED = 0;
  // No friendship and no request either way: a request can be sent.
  CONTACT_RELATION_NONE = 1;
  // The caller sent a request that is still pending.
  CONTACT_RELATION_REQUESTED = 2;
  // They sent the caller a request: RespondFriendRequest accepts it.
  CONTACT_RELATION_INCOMING = 3;
  CONTACT_RELATION_FRIEND = 4;
}

message SendFriendRequestsRequest {
  // 1 to 50 account ids, normally taken from FindContactsResponse.
  repeated string user_ids = 1;
}
